<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>4年 分数の計算練習（試作）</title>
    <style>
      :root {
        --bg: #eef4f6;
        --card: #ffffff;
        --ink: #22303a;
        --ink-soft: #54636e;
        --line: #d7e2e7;
        --add: #d96c2c;
        --add-soft: #fdeee2;
        --sub: #22708f;
        --sub-soft: #e3f1f6;
        --mixed: #35824a;
        --mixed-soft: #e6f3e9;
        --tokkun: #a8552f;
        --ok: #2e8b47;
        --ok-soft: #e4f4e8;
        --ng: #c0392b;
        --ng-soft: #fbe9e6;
        --key: #ffffff;
        --key-line: #c9d6dc;
        --radius: 20px;
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
        line-height: 1.6;
      }
      button { font-family: inherit; cursor: pointer; }
      .wrap { max-width: 780px; margin: 0 auto; padding: 20px 16px 48px; }

      /* ヘッダー */
      header.app-head {
        display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
        margin-bottom: 20px;
      }
      header.app-head h1 { font-size: 30px; margin: 0; letter-spacing: .02em; }
      .grade-tag {
        background: var(--ink); color: #fff; font-size: 15px; font-weight: 700;
        padding: 5px 12px; border-radius: 999px;
      }
      .trial-tag {
        background: #fff3cf; color: #7a5b00; border: 2px solid #e8c84a;
        font-size: 15px; font-weight: 700; padding: 3px 12px; border-radius: 999px;
      }
      .head-note { width: 100%; color: var(--ink-soft); font-size: 16px; margin: 2px 0 0; }

      /* カード共通 */
      .card {
        background: var(--card); border-radius: var(--radius);
        box-shadow: 0 2px 10px rgba(34, 48, 58, .08);
        padding: 22px;
      }
      .hidden { display: none !important; }

      /* トップ：練習カード */
      .menu { display: grid; gap: 16px; }
      button.type-card {
        display: block; width: 100%; text-align: left; border: 3px solid transparent;
        background: var(--card); border-radius: var(--radius);
        box-shadow: 0 2px 10px rgba(34, 48, 58, .08);
        padding: 20px 22px; color: var(--ink);
      }
      button.type-card:active { transform: scale(.99); }
      button.type-card.add { border-color: var(--add); }
      button.type-card.sub { border-color: var(--sub); }
      button.type-card.mixed { border-color: var(--mixed); }
      .type-card .t-name { font-size: 26px; font-weight: 800; margin: 0 0 4px; }
      .type-card .t-desc { font-size: 17px; color: var(--ink-soft); margin: 0 0 12px; }
      .type-card .t-go { font-size: 17px; font-weight: 700; margin-top: 12px; }
      .type-card.add .t-go { color: var(--add); }
      .type-card.sub .t-go { color: var(--sub); }
      .type-card.mixed .t-go { color: var(--mixed); }

      /* ナビキャラのチップ */
      .navi-chip {
        display: inline-flex; align-items: center; gap: 10px;
        border-radius: 999px; padding: 6px 16px 6px 8px; font-size: 16px;
      }
      .navi-chip .n-name {
        color: #fff; font-weight: 800; border-radius: 999px; padding: 2px 12px; font-size: 16px;
        white-space: nowrap; flex: none;
      }
      .navi-chip.add { background: var(--add-soft); }
      .navi-chip.add .n-name { background: var(--add); }
      .navi-chip.sub { background: var(--sub-soft); }
      .navi-chip.sub .n-name { background: var(--sub); }
      .navi-chip.mixed { background: var(--mixed-soft); }
      .navi-chip.mixed .n-name { background: var(--mixed); }

      /* トップ：下段カード */
      .sub-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
      @media (max-width: 560px) { .sub-menu { grid-template-columns: 1fr; } }
      button.sub-card {
        display: block; width: 100%; text-align: left; border: 2px solid var(--line);
        background: var(--card); border-radius: var(--radius);
        box-shadow: 0 2px 10px rgba(34, 48, 58, .06);
        padding: 18px 20px; color: var(--ink); min-height: 96px;
      }
      .sub-card .s-name { font-size: 21px; font-weight: 800; margin: 0 0 4px; }
      .sub-card .s-desc { font-size: 15px; color: var(--ink-soft); margin: 0; }
      .count-badge {
        display: inline-block; background: var(--tokkun); color: #fff; font-weight: 800;
        border-radius: 999px; padding: 0 12px; margin-left: 8px; font-size: 16px;
        vertical-align: 2px;
      }

      /* 練習画面 */
      .practice-top {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
      }
      .back-btn {
        background: #fff; border: 2px solid var(--line); border-radius: 999px;
        font-size: 16px; font-weight: 700; padding: 10px 18px; min-height: 48px; color: var(--ink);
      }
      .progress-label { font-size: 18px; font-weight: 800; }
      .dots { display: flex; gap: 6px; margin: 10px 0 4px; flex-wrap: wrap; }
      .dots span { width: 18px; height: 18px; border-radius: 50%; background: #dbe6ea; }
      .dots span.done-ok { background: var(--ok); }
      .dots span.done-ng { background: var(--ng); }
      .dots span.now { outline: 3px solid var(--ink); outline-offset: 1px; }

      .problem {
        font-size: 44px; font-weight: 700; text-align: center;
        padding: 26px 10px 8px; letter-spacing: .02em;
        display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap;
      }
      .frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.15; min-width: 44px; }
      .frac .f-num { padding: 0 10px; }
      .frac .f-den { padding: 0 10px; border-top: 4px solid currentColor; }
      .frac.mini { font-size: .62em; min-width: 30px; }
      .frac.mini .f-den { border-top-width: 3px; }
      .whole { font-size: 1em; }
      .op-sign { font-weight: 700; }

      /* 答え入力 */
      .answer-zone { display: flex; flex-direction: column; align-items: center; margin-top: 6px; }
      .answer-label { font-size: 16px; color: var(--ink-soft); margin-bottom: 6px; }
      .answer-frac { display: flex; flex-direction: column; align-items: center; gap: 0; }
      .field {
        width: 128px; min-height: 72px; border: 3px solid var(--line); border-radius: 14px;
        background: #fbfdfe; font-size: 40px; font-weight: 800; text-align: center;
        display: flex; align-items: center; justify-content: center; color: var(--ink);
        padding: 4px 8px;
      }
      .field.active { border-color: var(--ink); background: #fffbe8; box-shadow: 0 0 0 3px rgba(34,48,58,.12); }
      .field .placeholder { color: #b6c4cb; font-size: 22px; font-weight: 600; }
      .answer-bar { width: 150px; height: 5px; background: var(--ink); border-radius: 3px; margin: 7px 0; }
      .field-caption { font-size: 15px; color: var(--ink-soft); font-weight: 700; }

      /* テンキー */
      .keypad {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
        max-width: 430px; margin: 20px auto 0; width: 100%;
      }
      .keypad button {
        min-height: 64px; font-size: 28px; font-weight: 800;
        background: var(--key); border: 2px solid var(--key-line); border-radius: 16px; color: var(--ink);
      }
      .keypad button:active { background: #eef4f6; }
      .keypad button.util { font-size: 19px; background: #f2f6f8; }
      .keypad.disabled { opacity: .45; pointer-events: none; }

      .check-btn {
        display: block; width: 100%; max-width: 430px; margin: 18px auto 0;
        min-height: 64px; font-size: 22px; font-weight: 800; color: #fff;
        border: none; border-radius: 16px; background: var(--ink);
      }
      .check-btn:disabled { opacity: .4; }

      /* フィードバック */
      .feedback { margin-top: 20px; border-radius: 16px; padding: 18px 20px; font-size: 18px; }
      .feedback.ok { background: var(--ok-soft); border: 2px solid var(--ok); }
      .feedback.ng { background: var(--ng-soft); border: 2px solid var(--ng); }
      .feedback .f-title { font-size: 24px; font-weight: 800; margin: 0 0 6px; }
      .feedback.ok .f-title { color: var(--ok); }
      .feedback.ng .f-title { color: var(--ng); }
      .feedback p { margin: 6px 0; }
      .next-btn {
        display: block; width: 100%; max-width: 430px; margin: 16px auto 0;
        min-height: 60px; font-size: 21px; font-weight: 800; color: #fff;
        border: none; border-radius: 16px; background: var(--ink);
      }

      /* 結果・記録 */
      .result-score { font-size: 52px; font-weight: 800; text-align: center; margin: 8px 0 2px; }
      .result-msg { text-align: center; font-size: 19px; margin: 0 0 8px; }
      .btn-row { display: grid; gap: 12px; margin-top: 20px; }
      .btn-row button {
        min-height: 60px; font-size: 20px; font-weight: 800; border-radius: 16px;
      }
      .btn-primary { background: var(--ink); color: #fff; border: none; }
      .btn-ghost { background: #fff; color: var(--ink); border: 2px solid var(--line); }

      .record-row { border-bottom: 2px solid var(--line); padding: 16px 2px; }
      .record-row:last-of-type { border-bottom: none; }
      .record-row .r-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
      .record-row .r-name { font-size: 21px; font-weight: 800; }
      .record-row .r-nums { font-size: 18px; }
      .bar { height: 14px; background: #e4edf0; border-radius: 999px; margin-top: 8px; overflow: hidden; }
      .bar > div { height: 100%; border-radius: 999px; }
      .bar.add > div { background: var(--add); }
      .bar.sub > div { background: var(--sub); }
      .bar.mixed > div { background: var(--mixed); }
      .danger-zone { margin-top: 22px; text-align: center; }
      .reset-btn {
        background: #fff; border: 2px solid var(--ng); color: var(--ng);
        border-radius: 999px; font-size: 16px; font-weight: 700; padding: 10px 20px; min-height: 48px;
      }
      .reset-btn.confirm { background: var(--ng); color: #fff; }
      .section-title { font-size: 24px; font-weight: 800; margin: 0 0 6px; }
      .section-note { color: var(--ink-soft); font-size: 16px; margin: 0 0 10px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="app-head">
        <h1>分数の計算練習</h1>
        <span class="grade-tag">4年生・算数</span>
        <span class="trial-tag">試作</span>
        <p class="head-note">分母が 同じ 分数の 計算を 練習しよう。1回 10問です。</p>
      </header>

      <!-- トップ画面 -->
      <section id="view-home">
        <div class="menu">
          <button class="type-card add" data-start="add">
            <p class="t-name">分数の たし算</p>
            <p class="t-desc">分母が 同じ 分数どうしの たし算。答えが 1より 大きくなる 問題も あるよ。</p>
            <span class="navi-chip add"><span class="n-name">さく</span>ぶんぼは そのまま、ぶんしを たすよ</span>
            <p class="t-go">れんしゅうする →</p>
          </button>
          <button class="type-card sub" data-start="sub">
            <p class="t-name">分数の ひき算</p>
            <p class="t-desc">分母が 同じ 分数どうしの ひき算。</p>
            <span class="navi-chip sub"><span class="n-name">なみ</span>ぶんぼは そのまま、ぶんしを ひくよ</span>
            <p class="t-go">れんしゅうする →</p>
          </button>
          <button class="type-card mixed" data-start="mixed">
            <p class="t-name">帯分数の 計算</p>
            <p class="t-desc">帯分数が 入る たし算・ひき算。答えは 仮分数の ままで OK。</p>
            <span class="navi-chip mixed"><span class="n-name">かい</span>仮分数に なおしてから 計算すると 分かりやすいよ</span>
            <p class="t-go">れんしゅうする →</p>
          </button>
        </div>
        <div class="sub-menu">
          <button class="sub-card" id="btn-tokkun">
            <p class="s-name">とっくん（まちがい直し）<span class="count-badge" id="tokkun-count">0</span></p>
            <p class="s-desc" id="tokkun-desc">まちがえた 問題に もう一度 ちょうせん。正解すると 記録が 消えるよ。</p>
          </button>
          <button class="sub-card" id="btn-records">
            <p class="s-name">練習の 記録</p>
            <p class="s-desc">種類ごとに、解いた 問題数と 正解数を 見られるよ。</p>
          </button>
        </div>
      </section>

      <!-- 練習画面 -->
      <section id="view-practice" class="hidden">
        <div class="practice-top">
          <button class="back-btn" id="btn-quit">← トップへ もどる</button>
          <span class="progress-label" id="progress-label">1 / 10 もん</span>
        </div>
        <div class="card">
          <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
            <span id="practice-type-name" style="font-size:20px; font-weight:800;"></span>
            <span class="navi-chip" id="practice-chip"><span class="n-name" id="practice-navi-name"></span><span id="practice-navi-hint"></span></span>
          </div>
          <div class="dots" id="dots"></div>
          <div class="problem" id="problem"></div>

          <div class="answer-zone">
            <p class="answer-label">答えを 入れよう（仮分数の ままで OK）</p>
            <div class="answer-frac">
              <span class="field-caption">ぶんし</span>
              <div class="field active" id="field-num" role="button" tabindex="0" aria-label="ぶんし"></div>
              <div class="answer-bar"></div>
              <div class="field" id="field-den" role="button" tabindex="0" aria-label="ぶんぼ"></div>
              <span class="field-caption">ぶんぼ</span>
            </div>
          </div>

          <div class="keypad" id="keypad">
            <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
            <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
            <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
            <button data-key="clear" class="util">クリア</button><button data-key="0">0</button><button data-key="bs" class="util">けす</button>
          </div>
          <button class="check-btn" id="btn-check">こたえあわせ</button>

          <div class="feedback hidden" id="feedback">
            <p class="f-title" id="feedback-title"></p>
            <div id="feedback-body"></div>
            <button class="next-btn" id="btn-next">つぎの もんだいへ</button>
          </div>
        </div>
      </section>

      <!-- 結果画面 -->
      <section id="view-result" class="hidden">
        <div class="card">
          <p class="section-title" id="result-title" style="text-align:center;">けっか</p>
          <p class="result-score" id="result-score"></p>
          <p class="result-msg" id="result-msg"></p>
          <p class="result-msg" id="result-note" style="color:var(--ink-soft); font-size:16px;"></p>
          <div class="btn-row">
            <button class="btn-primary" id="btn-again">もう一度 れんしゅうする</button>
            <button class="btn-ghost" id="btn-result-home">トップへ もどる</button>
          </div>
        </div>
      </section>

      <!-- 記録画面 -->
      <section id="view-records" class="hidden">
        <div class="practice-top">
          <button class="back-btn" id="btn-records-back">← トップへ もどる</button>
        </div>
        <div class="card">
          <p class="section-title">練習の 記録</p>
          <p class="section-note">この タブレットに 保存されている 記録です。</p>
          <div id="record-list"></div>
          <div class="record-row">
            <div class="r-head">
              <span class="r-name">とっくん待ちの 問題</span>
              <span class="r-nums" id="record-tokkun"></span>
            </div>
          </div>
          <div class="danger-zone">
            <button class="reset-btn" id="btn-reset">記録を 全部 消す</button>
          </div>
        </div>
      </section>
    </div>

    <script>
      "use strict";

      /* ---------- 基本データ ---------- */
      var TYPES = {
        add:   { name: "分数の たし算",   navi: "さく", hint: "ぶんぼは そのまま、ぶんしを たすよ" },
        sub:   { name: "分数の ひき算",   navi: "なみ", hint: "ぶんぼは そのまま、ぶんしを ひくよ" },
        mixed: { name: "帯分数の 計算",   navi: "かい", hint: "仮分数に なおしてから 計算すると 分かりやすいよ" }
      };
      var KEY_MISTAKES = "bunsuRenshu4.mistakes.v1";
      var KEY_STATS = "bunsuRenshu4.stats.v1";
      var SESSION_LEN = 10;
      var DENS = [2, 3, 4, 5, 6, 7, 8, 9, 10];

      function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = a % b; a = b; b = t; } return a; }
      function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
      function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

      /* ---------- 保存（この端末の中だけ） ---------- */
      function loadJSON(key, fallback) {
        try {
          var raw = localStorage.getItem(key);
          if (!raw) return fallback;
          var v = JSON.parse(raw);
          return v == null ? fallback : v;
        } catch (e) { return fallback; }
      }
      function saveJSON(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* 保存できない環境では記録なしで続ける */ }
      }
      function loadMistakes() {
        var m = loadJSON(KEY_MISTAKES, []);
        return Array.isArray(m) ? m : [];
      }
      function loadStats() {
        var s = loadJSON(KEY_STATS, null);
        if (!s || typeof s !== "object") s = {};
        ["add", "sub", "mixed"].forEach(function (t) {
          if (!s[t] || typeof s[t].total !== "number") s[t] = { total: 0, correct: 0 };
        });
        return s;
      }
      function signature(p) {
        return p.type + "|" + p.op + "|" + p.terms.map(function (t) { return t.w + "," + t.n + "," + t.d; }).join("|");
      }
      function recordMistake(p) {
        var list = loadMistakes();
        var sig = signature(p);
        for (var i = 0; i < list.length; i++) { if (signature(list[i]) === sig) return; }
        list.push(p);
        saveJSON(KEY_MISTAKES, list);
      }
      function removeMistake(p) {
        var sig = signature(p);
        var list = loadMistakes().filter(function (m) { return signature(m) !== sig; });
        saveJSON(KEY_MISTAKES, list);
      }
      function addStat(type, correct) {
        var s = loadStats();
        s[type].total += 1;
        if (correct) s[type].correct += 1;
        saveJSON(KEY_STATS, s);
      }

      /* ---------- 問題の生成 ----------
         約分が 必要になる 答えは 出さない：
         答えの 分子と 分母が 互いに素（最大公約数 1）に なるまで 生成し直す。 */
      function makeAdd() {
        for (var i = 0; i < 300; i++) {
          var d = pick(DENS);
          var n1 = randInt(1, d - 1), n2 = randInt(1, d - 1);
          var ans = n1 + n2;
          if (gcd(ans, d) !== 1) continue;
          return { type: "add", op: "+",
            terms: [{ w: 0, n: n1, d: d }, { w: 0, n: n2, d: d }], ansN: ans, ansD: d };
        }
        return { type: "add", op: "+", terms: [{ w: 0, n: 1, d: 3 }, { w: 0, n: 1, d: 3 }], ansN: 2, ansD: 3 };
      }
      function makeSub() {
        for (var i = 0; i < 300; i++) {
          var d = pick(DENS);
          if (d < 3) continue;
          var n1 = randInt(2, d - 1), n2 = randInt(1, n1 - 1);
          var ans = n1 - n2;
          if (ans <= 0 || gcd(ans, d) !== 1) continue;
          return { type: "sub", op: "-",
            terms: [{ w: 0, n: n1, d: d }, { w: 0, n: n2, d: d }], ansN: ans, ansD: d };
        }
        return { type: "sub", op: "-", terms: [{ w: 0, n: 2, d: 3 }, { w: 0, n: 1, d: 3 }], ansN: 1, ansD: 3 };
      }
      function makeMixed() {
        for (var i = 0; i < 400; i++) {
          var d = pick(DENS);
          var op = Math.random() < 0.5 ? "+" : "-";
          var w1 = randInt(1, 3), n1 = randInt(1, d - 1);
          var w2, n2;
          var pattern = randInt(0, 2); // 0:帯分数＋真分数 / 1:帯分数＋帯分数 / 2:帯分数−帯分数 など
          if (op === "+") {
            if (pattern === 0) { w2 = 0; n2 = randInt(1, d - 1); }
            else { w2 = randInt(1, 3); n2 = randInt(1, d - 1); }
          } else {
            if (pattern === 0) { w2 = 0; n2 = randInt(1, d - 1); }
            else { w2 = randInt(1, w1); n2 = randInt(1, d - 1); }
          }
          var t1 = w1 * d + n1, t2 = w2 * d + n2;
          var ans = op === "+" ? t1 + t2 : t1 - t2;
          if (ans <= 0) continue;
          if (gcd(ans, d) !== 1) continue;
          return { type: "mixed", op: op,
            terms: [{ w: w1, n: n1, d: d }, { w: w2, n: n2, d: d }], ansN: ans, ansD: d };
        }
        return { type: "mixed", op: "+", terms: [{ w: 1, n: 1, d: 2 }, { w: 0, n: 1, d: 2 }], ansN: 3, ansD: 2 };
      }
      function makeProblem(type) {
        if (type === "add") return makeAdd();
        if (type === "sub") return makeSub();
        return makeMixed();
      }

      /* ---------- 分数の表示 ---------- */
      function fracHTML(n, d, mini) {
        return '<span class="frac' + (mini ? " mini" : "") + '"><span class="f-num">' + n +
          '</span><span class="f-den">' + d + "</span></span>";
      }
      function termHTML(t, mini) {
        var f = fracHTML(t.n, t.d, mini);
        if (t.w > 0) return '<span><span class="whole">' + t.w + "</span>" + f + "</span>";
        return f;
      }
      function problemHTML(p) {
        return termHTML(p.terms[0], false) +
          ' <span class="op-sign">' + (p.op === "+" ? "＋" : "－") + "</span> " +
          termHTML(p.terms[1], false) +
          ' <span class="op-sign">＝</span>';
      }
      function termText(t) {
        return (t.w > 0 ? t.w + "と " : "") + t.n + "/" + t.d;
      }
      function explainHTML(p) {
        var d = p.ansD, a = p.terms[0], b = p.terms[1];
        var verb = p.op === "+" ? "たす" : "ひく";
        var sign = p.op === "+" ? "＋" : "－";
        var parts = [];
        if (p.type === "mixed") {
          var t1 = a.w * d + a.n, t2 = b.w * d + b.n;
          parts.push(termHTML(a, true) + " は 仮分数に なおすと " + fracHTML(t1, d, true) +
            "、" + termHTML(b, true) + " は " + fracHTML(t2, d, true) + "。");
          parts.push("ぶんぼは そのまま " + d + "。ぶんしを 計算すると " +
            t1 + " " + sign + " " + t2 + " ＝ " + p.ansN + "。");
        } else {
          parts.push("ぶんぼは そのまま " + d + "。ぶんしどうしを " + verb + "と " +
            a.n + " " + sign + " " + b.n + " ＝ " + p.ansN + "。");
        }
        parts.push("答えは " + fracHTML(p.ansN, d, true) + " だよ。");
        if (p.ansN > d) parts.push("1より 大きい 答えは、仮分数の ままで OK。");
        return parts.join("<br>");
      }

      /* ---------- 画面の切り替え ---------- */
      var views = ["home", "practice", "result", "records"];
      function show(view) {
        views.forEach(function (v) {
          document.getElementById("view-" + v).classList.toggle("hidden", v !== view);
        });
        window.scrollTo(0, 0);
      }

      /* ---------- 練習セッション ---------- */
      var session = null; // { mode:'normal'|'tokkun', type, queue:[], idx, results:[bool], startMistakes }
      var input = { num: "", den: "" };
      var activeField = "num";
      var answered = false;

      function startNormal(type) {
        var queue = [];
        for (var i = 0; i < SESSION_LEN; i++) queue.push(makeProblem(type));
        session = { mode: "normal", type: type, queue: queue, idx: 0, results: [], addedMistakes: 0 };
        show("practice");
        renderProblem();
      }
      function startTokkun() {
        var list = loadMistakes();
        if (list.length === 0) return;
        session = { mode: "tokkun", type: null, queue: list.slice(), idx: 0, results: [], startMistakes: list.length, cleared: 0 };
        show("practice");
        renderProblem();
      }

      function currentProblem() { return session.queue[session.idx]; }

      function renderProblem() {
        var p = currentProblem();
        var meta = TYPES[p.type];
        answered = false;
        input = { num: "", den: "" };
        activeField = "num";

        document.getElementById("practice-type-name").textContent =
          session.mode === "tokkun" ? "とっくん（まちがい直し）" : meta.name;
        var chip = document.getElementById("practice-chip");
        chip.className = "navi-chip " + p.type;
        document.getElementById("practice-navi-name").textContent = meta.navi;
        document.getElementById("practice-navi-hint").textContent = meta.hint;

        document.getElementById("progress-label").textContent =
          (session.idx + 1) + " / " + session.queue.length + " もん";

        var dots = document.getElementById("dots");
        dots.innerHTML = "";
        session.queue.forEach(function (_, i) {
          var s = document.createElement("span");
          if (i < session.results.length) s.className = session.results[i] ? "done-ok" : "done-ng";
          else if (i === session.idx) s.className = "now";
          dots.appendChild(s);
        });

        document.getElementById("problem").innerHTML = problemHTML(p);
        document.getElementById("feedback").classList.add("hidden");
        document.getElementById("keypad").classList.remove("disabled");
        document.getElementById("btn-check").disabled = false;
        renderFields();
      }

      function renderFields() {
        var fn = document.getElementById("field-num");
        var fd = document.getElementById("field-den");
        fn.innerHTML = input.num === "" ? '<span class="placeholder">ぶんし</span>' : input.num;
        fd.innerHTML = input.den === "" ? '<span class="placeholder">ぶんぼ</span>' : input.den;
        fn.classList.toggle("active", activeField === "num" && !answered);
        fd.classList.toggle("active", activeField === "den" && !answered);
      }

      function pressKey(k) {
        if (answered) return;
        if (k === "clear") { input[activeField] = ""; }
        else if (k === "bs") { input[activeField] = input[activeField].slice(0, -1); }
        else {
          if (input[activeField].length >= 3) return;
          if (input[activeField] === "" && k === "0" && activeField === "den") { /* ぶんぼの先頭0は入れない */ }
          else input[activeField] = (input[activeField] + k).replace(/^0+(?=\d)/, "");
        }
        renderFields();
      }

      function checkAnswer() {
        if (answered) return;
        if (input.num === "" || input.den === "") return;
        var p = currentProblem();
        var un = parseInt(input.num, 10), ud = parseInt(input.den, 10);
        if (isNaN(un) || isNaN(ud) || ud === 0) return;
        /* 約分した形や 帯分数に直した形ではなく、値が等しければ正解
           （答えは約分不要な形で出題しているので、通常は そのまま一致する） */
        var correct = (un * p.ansD === p.ansN * ud);
        answered = true;
        session.results.push(correct);
        addStat(p.type, correct);

        if (correct) {
          removeMistake(p); // 通常練習で正解しても克服扱い
          if (session.mode === "tokkun") session.cleared += 1;
        } else {
          recordMistake(p);
          if (session.mode === "normal") session.addedMistakes += 1;
        }

        var fb = document.getElementById("feedback");
        fb.classList.remove("hidden", "ok", "ng");
        fb.classList.add(correct ? "ok" : "ng");
        document.getElementById("feedback-title").textContent = correct ? "○ せいかい！" : "× ざんねん…";
        var body = "";
        if (!correct) {
          body += "<p>きみの 答え： " + fracHTML(un, ud, true) + "</p>";
        }
        body += "<p>" + explainHTML(p) + "</p>";
        if (correct && session.mode === "tokkun") body += "<p>この 問題は 克服！ 記録から 消えたよ。</p>";
        document.getElementById("feedback-body").innerHTML = body;
        document.getElementById("btn-next").textContent =
          session.idx + 1 >= session.queue.length ? "けっかを 見る" : "つぎの もんだいへ";
        document.getElementById("keypad").classList.add("disabled");
        document.getElementById("btn-check").disabled = true;
        renderFields();
        // ドットを更新
        renderDotsOnly();
        fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      function renderDotsOnly() {
        var dots = document.getElementById("dots");
        dots.innerHTML = "";
        session.queue.forEach(function (_, i) {
          var s = document.createElement("span");
          if (i < session.results.length) s.className = session.results[i] ? "done-ok" : "done-ng";
          else if (i === session.idx) s.className = "now";
          dots.appendChild(s);
        });
      }

      function nextProblem() {
        session.idx += 1;
        if (session.idx >= session.queue.length) { showResult(); return; }
        renderProblem();
      }

      function showResult() {
        var total = session.results.length;
        var ok = session.results.filter(Boolean).length;
        var title = document.getElementById("result-title");
        var score = document.getElementById("result-score");
        var msg = document.getElementById("result-msg");
        var note = document.getElementById("result-note");
        var again = document.getElementById("btn-again");
        document.getElementById("btn-result-home").classList.toggle("hidden", session.mode === "tokkun");
        if (session.mode === "tokkun") {
          title.textContent = "とっくんの けっか";
          score.textContent = session.cleared + " もん 克服！";
          msg.textContent = "さいしょ " + session.startMistakes + " もん あった まちがいが、" +
            loadMistakes().length + " もんに なったよ。";
          note.textContent = loadMistakes().length > 0 ? "残りは また とっくんで ちょうせんしよう。" : "まちがえた 問題は 全部 克服できたね！";
          again.textContent = "トップへ もどる";
          again.dataset.action = "home";
        } else {
          title.textContent = TYPES[session.type].name + " の けっか";
          score.textContent = ok + " / " + total + " もん せいかい";
          msg.textContent = ok === total ? "全問 せいかい！ すごいね。" :
            ok >= total * 0.7 ? "よく がんばったね。" : "まちがえた 問題は 「とっくん」で 直せるよ。";
          note.textContent = session.addedMistakes > 0 ?
            "新しく まちがえた 問題が " + session.addedMistakes + " もん、とっくんに 記録されたよ。" :
            "新しく まちがえた 問題は なかったよ。";
          again.textContent = "もう一度 れんしゅうする";
          again.dataset.action = "again";
        }
        show("result");
      }

      /* ---------- 記録画面 ---------- */
      function renderRecords() {
        var s = loadStats();
        var list = document.getElementById("record-list");
        list.innerHTML = "";
        ["add", "sub", "mixed"].forEach(function (t) {
          var st = s[t];
          var pct = st.total > 0 ? Math.round(st.correct / st.total * 100) : 0;
          var row = document.createElement("div");
          row.className = "record-row";
          row.innerHTML =
            '<div class="r-head"><span class="r-name">' + TYPES[t].name + '</span>' +
            '<span class="r-nums">' + st.total + ' もん中 ' + st.correct + ' もん せいかい（' + pct + '%）</span></div>' +
            '<div class="bar ' + t + '"><div style="width:' + pct + '%"></div></div>';
          list.appendChild(row);
        });
        document.getElementById("record-tokkun").textContent = loadMistakes().length + " もん";
        var rb = document.getElementById("btn-reset");
        rb.textContent = "記録を 全部 消す";
        rb.classList.remove("confirm");
        rb.dataset.armed = "";
      }

      function refreshHome() {
        var n = loadMistakes().length;
        document.getElementById("tokkun-count").textContent = n;
        document.getElementById("tokkun-desc").textContent = n > 0 ?
          "まちがえた 問題に もう一度 ちょうせん。正解すると 記録が 消えるよ。" :
          "まちがえた 問題は まだ ないよ。れんしゅうで まちがえると ここに たまるよ。";
      }

      /* ---------- イベント ---------- */
      document.querySelectorAll("[data-start]").forEach(function (el) {
        el.addEventListener("click", function () { startNormal(el.dataset.start); });
      });
      document.getElementById("btn-tokkun").addEventListener("click", function () {
        if (loadMistakes().length === 0) {
          document.getElementById("tokkun-desc").textContent = "まちがえた 問題は まだ ないよ。先に れんしゅうを してみよう。";
          return;
        }
        startTokkun();
      });
      document.getElementById("btn-records").addEventListener("click", function () {
        renderRecords();
        show("records");
      });
      document.getElementById("btn-records-back").addEventListener("click", function () { refreshHome(); show("home"); });
      document.getElementById("btn-quit").addEventListener("click", function () { refreshHome(); show("home"); });
      document.getElementById("btn-result-home").addEventListener("click", function () { refreshHome(); show("home"); });
      document.getElementById("btn-again").addEventListener("click", function () {
        if (this.dataset.action === "again" && session) startNormal(session.type);
        else { refreshHome(); show("home"); }
      });
      document.getElementById("btn-next").addEventListener("click", nextProblem);
      document.getElementById("btn-check").addEventListener("click", checkAnswer);

      document.getElementById("field-num").addEventListener("click", function () { if (!answered) { activeField = "num"; renderFields(); } });
      document.getElementById("field-den").addEventListener("click", function () { if (!answered) { activeField = "den"; renderFields(); } });

      document.getElementById("keypad").addEventListener("click", function (e) {
        var b = e.target.closest("button");
        if (!b) return;
        pressKey(b.dataset.key);
      });

      document.getElementById("btn-reset").addEventListener("click", function () {
        if (this.dataset.armed === "1") {
          saveJSON(KEY_MISTAKES, []);
          saveJSON(KEY_STATS, { add: { total: 0, correct: 0 }, sub: { total: 0, correct: 0 }, mixed: { total: 0, correct: 0 } });
          renderRecords();
        } else {
          this.dataset.armed = "1";
          this.textContent = "ほんとうに 消す？ もう一度 おしてね";
          this.classList.add("confirm");
        }
      });

      refreshHome();
    </script>
  </body>
</html>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>4年生 分数ラボ｜TT-sensei</title>
    <style>
      :root {
        --bg: #eef4f6;
        --card: #ffffff;
        --ink: #22303a;
        --ink-soft: #54636e;
        --line: #d7e2e7;
        --add: #d96c2c;
        --add-soft: #fdeee2;
        --sub: #22708f;
        --sub-soft: #e3f1f6;
        --mixed: #35824a;
        --mixed-soft: #e6f3e9;
        --tokkun: #a8552f;
        --ok: #2e8b47;
        --ok-soft: #e4f4e8;
        --ng: #c0392b;
        --ng-soft: #fbe9e6;
        --key: #ffffff;
        --key-line: #c9d6dc;
        --radius: 20px;
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
        line-height: 1.6;
      }
      button { font-family: inherit; cursor: pointer; }
      .wrap { max-width: 780px; margin: 0 auto; padding: 20px 16px 48px; }

      /* ヘッダー */
      header.app-head {
        display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
        margin-bottom: 20px;
      }
      header.app-head h1 { font-size: 30px; margin: 0; letter-spacing: .02em; }
      .grade-tag {
        background: var(--ink); color: #fff; font-size: 15px; font-weight: 700;
        padding: 5px 12px; border-radius: 999px;
      }
      .trial-tag {
        background: #fff3cf; color: #7a5b00; border: 2px solid #e8c84a;
        font-size: 15px; font-weight: 700; padding: 3px 12px; border-radius: 999px;
      }
      .head-note { width: 100%; color: var(--ink-soft); font-size: 16px; margin: 2px 0 0; }

      /* カード共通 */
      .card {
        background: var(--card); border-radius: var(--radius);
        box-shadow: 0 2px 10px rgba(34, 48, 58, .08);
        padding: 22px;
      }
      .hidden { display: none !important; }

      /* トップ：練習カード */
      .menu { display: grid; gap: 16px; }
      button.type-card {
        display: block; width: 100%; text-align: left; border: 3px solid transparent;
        background: var(--card); border-radius: var(--radius);
        box-shadow: 0 2px 10px rgba(34, 48, 58, .08);
        padding: 20px 22px; color: var(--ink);
      }
      button.type-card:active { transform: scale(.99); }
      button.type-card.add { border-color: var(--add); }
      button.type-card.sub { border-color: var(--sub); }
      button.type-card.mixed { border-color: var(--mixed); }
      .type-card .t-name { font-size: 26px; font-weight: 800; margin: 0 0 4px; }
      .type-card .t-desc { font-size: 17px; color: var(--ink-soft); margin: 0 0 12px; }
      .type-card .t-go { font-size: 17px; font-weight: 700; margin-top: 12px; }
      .type-card.add .t-go { color: var(--add); }
      .type-card.sub .t-go { color: var(--sub); }
      .type-card.mixed .t-go { color: var(--mixed); }

      /* ナビキャラのチップ */
      .navi-chip {
        display: inline-flex; align-items: center; gap: 10px;
        border-radius: 999px; padding: 6px 16px 6px 8px; font-size: 16px;
      }
      .navi-chip .n-name {
        color: #fff; font-weight: 800; border-radius: 999px; padding: 2px 12px; font-size: 16px;
        white-space: nowrap; flex: none;
      }
      .navi-chip.add { background: var(--add-soft); }
      .navi-chip.add .n-name { background: var(--add); }
      .navi-chip.sub { background: var(--sub-soft); }
      .navi-chip.sub .n-name { background: var(--sub); }
      .navi-chip.mixed { background: var(--mixed-soft); }
      .navi-chip.mixed .n-name { background: var(--mixed); }

      /* トップ：下段カード */
      .sub-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
      @media (max-width: 560px) { .sub-menu { grid-template-columns: 1fr; } }
      button.sub-card {
        display: block; width: 100%; text-align: left; border: 2px solid var(--line);
        background: var(--card); border-radius: var(--radius);
        box-shadow: 0 2px 10px rgba(34, 48, 58, .06);
        padding: 18px 20px; color: var(--ink); min-height: 96px;
      }
      .sub-card .s-name { font-size: 21px; font-weight: 800; margin: 0 0 4px; }
      .sub-card .s-desc { font-size: 15px; color: var(--ink-soft); margin: 0; }
      .count-badge {
        display: inline-block; background: var(--tokkun); color: #fff; font-weight: 800;
        border-radius: 999px; padding: 0 12px; margin-left: 8px; font-size: 16px;
        vertical-align: 2px;
      }

      /* 練習画面 */
      .practice-top {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
      }
      .back-btn {
        background: #fff; border: 2px solid var(--line); border-radius: 999px;
        font-size: 16px; font-weight: 700; padding: 10px 18px; min-height: 48px; color: var(--ink);
      }
      .progress-label { font-size: 18px; font-weight: 800; }
      .dots { display: flex; gap: 6px; margin: 10px 0 4px; flex-wrap: wrap; }
      .dots span { width: 18px; height: 18px; border-radius: 50%; background: #dbe6ea; }
      .dots span.done-ok { background: var(--ok); }
      .dots span.done-ng { background: var(--ng); }
      .dots span.now { outline: 3px solid var(--ink); outline-offset: 1px; }

      .problem {
        font-size: 44px; font-weight: 700; text-align: center;
        padding: 26px 10px 8px; letter-spacing: .02em;
        display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap;
      }
      .frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.15; min-width: 44px; }
      .frac .f-num { padding: 0 10px; }
      .frac .f-den { padding: 0 10px; border-top: 4px solid currentColor; }
      .frac.mini { font-size: .62em; min-width: 30px; }
      .frac.mini .f-den { border-top-width: 3px; }
      .whole { font-size: 1em; }
      .op-sign { font-weight: 700; }

      /* 答え入力 */
      .answer-zone { display: flex; flex-direction: column; align-items: center; margin-top: 6px; }
      .answer-label { font-size: 16px; color: var(--ink-soft); margin-bottom: 6px; }
      .answer-frac { display: flex; flex-direction: column; align-items: center; gap: 0; }
      .field {
        width: 128px; min-height: 72px; border: 3px solid var(--line); border-radius: 14px;
        background: #fbfdfe; font-size: 40px; font-weight: 800; text-align: center;
        display: flex; align-items: center; justify-content: center; color: var(--ink);
        padding: 4px 8px;
      }
      .field.active { border-color: var(--ink); background: #fffbe8; box-shadow: 0 0 0 3px rgba(34,48,58,.12); }
      .field .placeholder { color: #b6c4cb; font-size: 22px; font-weight: 600; }
      .answer-bar { width: 150px; height: 5px; background: var(--ink); border-radius: 3px; margin: 7px 0; }
      .field-caption { font-size: 15px; color: var(--ink-soft); font-weight: 700; }

      /* テンキー */
      .keypad {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
        max-width: 430px; margin: 20px auto 0; width: 100%;
      }
      .keypad button {
        min-height: 64px; font-size: 28px; font-weight: 800;
        background: var(--key); border: 2px solid var(--key-line); border-radius: 16px; color: var(--ink);
      }
      .keypad button:active { background: #eef4f6; }
      .keypad button.util { font-size: 19px; background: #f2f6f8; }
      .keypad.disabled { opacity: .45; pointer-events: none; }

      .check-btn {
        display: block; width: 100%; max-width: 430px; margin: 18px auto 0;
        min-height: 64px; font-size: 22px; font-weight: 800; color: #fff;
        border: none; border-radius: 16px; background: var(--ink);
      }
      .check-btn:disabled { opacity: .4; }

      /* ステップ方式：分母の注目表示 */
      .frac .f-den.focus-den { background: #ffedb0; border-radius: 4px; }

      /* 答えの組み立て表示 */
      .builder-wrap { text-align: center; margin-top: 12px; }
      .builder-label { font-size: 15px; color: var(--ink-soft); font-weight: 700; margin: 0 0 4px; }
      .builder {
        display: flex; align-items: center; justify-content: center; gap: 12px;
        font-size: 44px; font-weight: 800; min-height: 100px;
      }
      .builder .frac { font-size: 44px; }
      .slot {
        display: inline-flex; align-items: center; justify-content: center;
        min-width: 58px; min-height: 58px; padding: 2px 10px;
        border-radius: 12px; border: 3px solid var(--line); background: #fbfdfe;
      }
      .slot.empty { color: #b6c4cb; border-style: dashed; }
      .slot.active { border-color: var(--ink); background: #fffbe8; box-shadow: 0 0 0 3px rgba(34,48,58,.12); }

      /* ステップパネル */
      .step-panel { margin-top: 18px; border-top: 2px dashed var(--line); padding-top: 16px; }
      .step-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .step-badge {
        background: var(--ink); color: #fff; font-weight: 800; font-size: 15px;
        border-radius: 999px; padding: 3px 12px; white-space: nowrap;
      }
      .step-title { font-size: 23px; font-weight: 800; }
      .step-reason { font-size: 17px; color: var(--ink-soft); margin: 8px 0 0; }
      .step-note { font-size: 19px; text-align: center; margin-top: 12px; }
      .step-expr { font-size: 26px; font-weight: 800; text-align: center; margin: 12px 0 0; }
      .step-fields {
        display: flex; gap: 16px; justify-content: center; align-items: flex-start;
        margin-top: 14px; flex-wrap: wrap;
      }
      .step-field { display: flex; flex-direction: column; align-items: center; gap: 6px; }
      .final-answer {
        font-size: 40px; font-weight: 700; text-align: center;
        display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap;
        padding: 8px 0;
      }

      /* フィードバック */
      .feedback { margin-top: 20px; border-radius: 16px; padding: 18px 20px; font-size: 18px; }
      .feedback.ok { background: var(--ok-soft); border: 2px solid var(--ok); }
      .feedback.ng { background: var(--ng-soft); border: 2px solid var(--ng); }
      .feedback .f-title { font-size: 24px; font-weight: 800; margin: 0 0 6px; }
      .feedback.ok .f-title { color: var(--ok); }
      .feedback.ng .f-title { color: var(--ng); }
      .feedback p { margin: 6px 0; }
      .next-btn {
        display: block; width: 100%; max-width: 430px; margin: 16px auto 0;
        min-height: 60px; font-size: 21px; font-weight: 800; color: #fff;
        border: none; border-radius: 16px; background: var(--ink);
      }

      /* 結果・記録 */
      .result-score { font-size: 52px; font-weight: 800; text-align: center; margin: 8px 0 2px; }
      .result-msg { text-align: center; font-size: 19px; margin: 0 0 8px; }
      .btn-row { display: grid; gap: 12px; margin-top: 20px; }
      .btn-row button {
        min-height: 60px; font-size: 20px; font-weight: 800; border-radius: 16px;
      }
      .btn-primary { background: var(--ink); color: #fff; border: none; }
      .btn-ghost { background: #fff; color: var(--ink); border: 2px solid var(--line); }

      .record-row { border-bottom: 2px solid var(--line); padding: 16px 2px; }
      .record-row:last-of-type { border-bottom: none; }
      .record-row .r-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
      .record-row .r-name { font-size: 21px; font-weight: 800; }
      .record-row .r-nums { font-size: 18px; }
      .bar { height: 14px; background: #e4edf0; border-radius: 999px; margin-top: 8px; overflow: hidden; }
      .bar > div { height: 100%; border-radius: 999px; }
      .bar.add > div { background: var(--add); }
      .bar.sub > div { background: var(--sub); }
      .bar.mixed > div { background: var(--mixed); }
      .danger-zone { margin-top: 22px; text-align: center; }
      .reset-btn {
        background: #fff; border: 2px solid var(--ng); color: var(--ng);
        border-radius: 999px; font-size: 16px; font-weight: 700; padding: 10px 20px; min-height: 48px;
      }
      .reset-btn.confirm { background: var(--ng); color: #fff; }
      .section-title { font-size: 24px; font-weight: 800; margin: 0 0 6px; }
      .section-note { color: var(--ink-soft); font-size: 16px; margin: 0 0 10px; }

      /* ---- 分数ラボ：学習導線・端末表示 ---- */
      .wrap { max-width: 1180px; padding: 16px 22px 40px; }
      .app-head { justify-content: space-between; align-items: center; gap: 22px; margin-bottom: 18px; }
      .head-copy { min-width: 0; flex: 1; }
      .head-eyebrow { color: var(--ink-soft); font-size: 15px; font-weight: 800; letter-spacing: .08em; margin: 0 0 2px; }
      header.app-head h1 { font-size: clamp(28px, 3vw, 36px); line-height: 1.2; }
      .head-note { font-size: 16px; margin-top: 8px; }
      .home-navi { display: block; width: min(27vw, 250px); max-height: 130px; object-fit: contain; object-position: center bottom; flex: none; }
      .home-path { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
      .home-path span { display: inline-flex; align-items: center; gap: 7px; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; color: #40515c; font-size: 14px; font-weight: 800; }
      .home-path b { color: #82929a; font-size: 13px; }
      .home-intro { margin: 8px 0 12px; color: var(--ink-soft); font-size: 15px; }
      .menu { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
      button.type-card { min-height: 158px; padding: 18px 20px; border-radius: 18px; position: relative; }
      .type-card .card-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .type-card .card-copy { min-width: 0; }
      .type-card .t-name { font-size: 23px; line-height: 1.3; margin-bottom: 6px; }
      .type-card .t-desc { font-size: 15px; line-height: 1.55; margin: 0; }
      .type-card .t-go { font-size: 15px; margin: 12px 0 0; }
      .type-card.represent { border-color: #7768a9; }
      .type-card.compare { border-color: #c18b32; }
      .type-card.represent .t-go { color: #695b9a; }
      .type-card.compare .t-go { color: #9b6a1e; }
      .card-navi { width: 76px; height: 92px; object-fit: contain; flex: none; }
      .navi-chip { background: #f3f7f9; border-radius: 999px; padding: 4px 12px 4px 5px; color: #43535d; font-size: 14px; gap: 8px; }
      .navi-chip img { width: 42px; height: 48px; object-fit: contain; flex: none; }
      .practice-adviser { display:flex; align-items:center; gap:12px; min-height:54px; }
      .practice-adviser img { width:54px; height:62px; object-fit:contain; flex:none; }
      .practice-adviser .adviser-copy { min-width:0; }
      .practice-adviser .adviser-hint { margin:4px 0 0; color:var(--ink-soft); font-size:14px; }
      .practice-layout { display:grid; grid-template-columns:minmax(0, 1.12fr) minmax(330px, .88fr); gap:22px; align-items:start; }
      .practice-main, .practice-input { min-width:0; }
      .practice-main { border-right:1px solid var(--line); padding-right:20px; }
      .problem { min-height:82px; padding:14px 8px 8px; font-size:clamp(34px, 4vw, 46px); }
      .problem-caption { display:block; width:100%; font-size:15px; color:var(--ink-soft); font-weight:700; text-align:center; }
      .comparison-model { margin:8px auto 14px; max-width:470px; padding:12px 16px; border:1px solid var(--line); border-radius:14px; background:#f8fbfc; }
      .fraction-bar-row { display:grid; grid-template-columns:22px minmax(0,1fr) 56px; align-items:center; gap:10px; margin:8px 0; font-size:14px; font-weight:800; }
      .fraction-bar-label { color:var(--ink-soft); text-align:center; }
      .fraction-track { height:20px; border:1px solid #bdcbd2; border-radius:5px; overflow:hidden; background-color:#fff; background-image:linear-gradient(to right, transparent calc(100% - 1px), #c5d2d8 calc(100% - 1px)); background-size:calc(100% / var(--parts)) 100%; background-repeat:repeat-x; }
      .fraction-fill { height:100%; background:rgba(58, 125, 157, .32); border-right:1px solid rgba(58,125,157,.45); }
      .builder-wrap { margin-top:8px; }
      .builder { min-height:76px; }
      .step-panel { margin-top:12px; padding-top:12px; }
      .step-title { font-size:20px; }
      .step-reason { font-size:15px; line-height:1.55; }
      .step-expr { font-size:23px; margin-top:8px; }
      .step-fields { margin-top:10px; gap:12px; }
      .field { min-height:60px; width:112px; font-size:34px; }
      .practice-input { padding-top:8px; }
      .keypad { margin-top:8px; max-width:100%; gap:8px; }
      .keypad button { min-height:58px; }
      .check-btn { max-width:100%; margin-top:12px; min-height:58px; }
      .symbol-keys { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:430px; margin:18px auto 0; }
      .symbol-keys button { min-height:70px; border:2px solid var(--key-line); border-radius:14px; background:#fff; color:var(--ink); font-size:32px; font-weight:800; }
      .symbol-keys button:active { background:#eef4f6; }
      .feedback { margin-top:14px; padding:14px 16px; font-size:16px; }
      .feedback .f-title { font-size:21px; }
      .next-btn { min-height:54px; font-size:19px; }
      .type-card:focus-visible, button:focus-visible, .field:focus-visible { outline:3px solid #263f50; outline-offset:3px; }
      .bar.represent > div { background:#7768a9; }
      .bar.compare > div { background:#c18b32; }
      @media (max-width: 820px) {
        .wrap { padding:14px 14px 32px; }
        .practice-layout { grid-template-columns:1fr; gap:10px; }
        .practice-main { border-right:0; border-bottom:1px solid var(--line); padding:0 0 14px; }
        .practice-input { padding-top:0; }
        .keypad { max-width:430px; }
        .check-btn { max-width:430px; }
        .symbol-keys { max-width:430px; }
      }
      @media (max-width: 600px) {
        .app-head { gap:8px; align-items:flex-start; }
        .home-navi { width:100px; max-height:92px; margin-top:4px; }
        .home-path { gap:5px; }
        .home-path span { font-size:12px; padding:4px 8px; }
        .menu { grid-template-columns:1fr; gap:10px; }
        button.type-card { min-height:136px; padding:15px 16px; }
        .card-navi { width:64px; height:76px; }
        .type-card .t-name { font-size:21px; }
        .sub-menu { grid-template-columns:1fr 1fr; gap:10px; }
        button.sub-card { padding:14px 12px; }
        .s-name { font-size:18px !important; }
        .s-desc { font-size:13px !important; }
        .problem { font-size:36px; gap:10px; }
        .step-title { font-size:18px; }
        .practice-adviser img { width:46px; height:52px; }
      }
      @media (min-width: 900px) and (orientation:landscape) and (min-height:650px) {
        .practice-top { margin-bottom:8px; }
        .card { padding:18px 20px; }
        .practice-layout { gap:16px; }
        .problem { min-height:70px; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="app-head">
        <div class="head-copy">
          <p class="head-eyebrow">4年生・算数</p>
          <h1>分数ラボ</h1>
          <p class="head-note">分数の表し方・大きさ・計算を、図とステップで確かめよう。1回10問です。</p>
          <div class="home-path" aria-label="学習の流れ">
            <span>01 表し方</span><b>→</b><span>02 大きさ</span><b>→</b><span>03 計算</span>
          </div>
        </div>
        <img class="home-navi" src="https://tt-sensei.github.io/navi-character-/assets/web/groups/group-studying.webp" alt="" loading="lazy" decoding="async" onerror="this.hidden=true" />
      </header>

      <!-- トップ画面 -->
      <section id="view-home">
        <p class="home-intro">学びの順に、できるところから取り組もう。どの練習も10問ずつ進みます。</p>
        <div class="menu">
          <button class="type-card represent" data-start="represent">
            <div class="card-row"><div class="card-copy">
              <p class="t-name">分数の表し方</p>
              <p class="t-desc">真分数・仮分数・帯分数。分数の表し方を行き来しよう。</p>
            </div><img class="card-navi" data-home-navi alt="" loading="lazy" decoding="async" onerror="this.hidden=true" /></div>
            <p class="t-go">れんしゅうする →</p>
          </button>
          <button class="type-card compare" data-start="compare">
            <div class="card-row"><div class="card-copy">
              <p class="t-name">分数の大きさ</p>
              <p class="t-desc">図で大きさを比べ、同じ大きさを表す分数を見つけよう。</p>
            </div><img class="card-navi" data-home-navi alt="" loading="lazy" decoding="async" onerror="this.hidden=true" /></div>
            <p class="t-go">れんしゅうする →</p>
          </button>
          <button class="type-card add" data-start="add">
            <div class="card-row"><div class="card-copy">
              <p class="t-name">分数のたし算</p>
              <p class="t-desc">同じ大きさの1こ分が、合わせて何こ分になるか考えよう。</p>
            </div><img class="card-navi" data-home-navi alt="" loading="lazy" decoding="async" onerror="this.hidden=true" /></div>
            <p class="t-go">れんしゅうする →</p>
          </button>
          <button class="type-card sub" data-start="sub">
            <div class="card-row"><div class="card-copy">
              <p class="t-name">分数のひき算</p>
              <p class="t-desc">同じ大きさの1こ分が、いくつ分残るか考えよう。</p>
            </div><img class="card-navi" data-home-navi alt="" loading="lazy" decoding="async" onerror="this.hidden=true" /></div>

        <div class="sub-menu">
          <button class="sub-card" id="btn-tokkun">
            <p class="s-name">とっくん（まちがい直し）<span class="count-badge" id="tokkun-count">0</span></p>
            <p class="s-desc" id="tokkun-desc">まちがえた 問題に もう一度 ちょうせん。正解すると 記録が 消えるよ。</p>

          <button class="sub-card" id="btn-records">
            <p class="s-name">練習の 記録</p>

      <!-- 練習画面 -->
      <section id="view-practice" class="hidden">

          <button class="back-btn" id="btn-quit">← トップへ もどる</button>

        <div class="card">
          <div class="practice-adviser">
            <img id="practice-navi-image" alt="" loading="lazy" decoding="async" onerror="this.hidden=true" />
            <div class="adviser-copy">
              <span id="practice-type-name" style="font-size:20px; font-weight:800;"></span>
              <p class="adviser-hint" id="practice-navi-hint"></p>

          <div class="dots" id="dots"></div>

            <div class="practice-main">
              <div class="problem" id="problem"></div>
              <div class="comparison-model hidden" id="comparison-model"></div>
              <div class="builder-wrap" id="builder-wrap">
                <p class="builder-label">答えを 組み立てよう</p>
                <div class="builder" id="builder"></div>

              <div class="step-panel">
                <div class="step-head">
                  <span class="step-badge" id="step-badge"></span>

                <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
                <button data-key="clear" class="util">クリア</button><button data-key="0">0</button><button data-key="bs" class="util">けす</button>
              </div>
              <div class="symbol-keys hidden" id="symbol-keys">
                <button data-key="lt">＜</button><button data-key="eq">＝</button><button data-key="gt">＞</button>
              </div>
              <button class="check-btn" id="btn-check">たしかめる</button>
              <div class="feedback hidden" id="feedback">
                <p class="f-title" id="feedback-title"></p>
                <div id="feedback-body"></div>

      <!-- 結果画面 -->
      <section id="view-result" class="hidden">
        <div class="card">
          <p class="section-title" id="result-title" style="text-align:center;">けっか</p>
          <p class="result-score" id="result-score"></p>
          <p class="result-msg" id="result-msg"></p>
          <p class="result-msg" id="result-note" style="color:var(--ink-soft); font-size:16px;"></p>
          <div class="btn-row">
            <button class="btn-primary" id="btn-again">もう一度 れんしゅうする</button>
            <button class="btn-ghost" id="btn-result-home">トップへ もどる</button>

      <!-- 記録画面 -->
      <section id="view-records" class="hidden">
        <div class="practice-top">
          <button class="back-btn" id="btn-records-back">← トップへ もどる</button>
        </div>
        <div class="card">
          <p class="section-title">練習の 記録</p>
          <p class="section-note">この タブレットに 保存されている 記録です。</p>
          <div id="record-list"></div>
          <div class="record-row">
            <div class="r-head">
              <span class="r-name">とっくん待ちの 問題</span>
              <span class="r-nums" id="record-tokkun"></span>
            </div>
          </div>
          <div class="danger-zone">
            <button class="reset-btn" id="btn-reset">記録を 全部 消す</button>
          </div>
        </div>
      </section>
    </div>

    <script>
      "use strict";

      /* ---------- 基本データ ---------- */
      var TYPES = {
        represent: { name: "分数の表し方", hint: "分母の数だけ分けた1こ分が、いくつ分あるか考えよう。" },
        compare:   { name: "分数の大きさ", hint: "図の長さや、1こ分の大きさに注目して比べよう。" },
        add:       { name: "分数のたし算", hint: "同じ大きさの1こ分を、合わせて何こ分か考えよう。" },
        sub:       { name: "分数のひき算", hint: "同じ大きさの1こ分が、いくつ分残るか考えよう。" },
        mixed:     { name: "以前の記録：帯分数の計算", hint: "整数の部分と分数の部分を分けて考えよう。" }
      };
      var NAVI_BASE = "https://tt-sensei.github.io/navi-character-/assets/web/characters/";
      var NAVI_POOL = ["riku", "sora", "kai", "saku", "nami", "tsuki"];
      function naviImageUrl(character, pose) {
        return NAVI_BASE + character + "/fullbody/" + pose + ".webp";
      }
      function setRandomNavi(img, pose) {
        if (!img) return;
        img.hidden = false;
        img.src = naviImageUrl(pick(NAVI_POOL), pose);
      }
      var KEY_MISTAKES = "bunsuRenshu4.mistakes.v1";
      var KEY_STATS = "bunsuRenshu4.stats.v1";
      var SESSION_LEN = 10;
      var DENS = [2, 3, 4, 5, 6, 7, 8, 9, 10];

      function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = a % b; a = b; b = t; } return a; }
      function randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }
      function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

      /* ---------- 保存（この端末の中だけ） ---------- */
      function loadJSON(key, fallback) {
        try {
          var raw = localStorage.getItem(key);
          if (!raw) return fallback;
          var v = JSON.parse(raw);
          return v == null ? fallback : v;
        } catch (e) { return fallback; }
      }
      function saveJSON(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* 保存できない環境では記録なしで続ける */ }
      }
      function loadMistakes() {
        var m = loadJSON(KEY_MISTAKES, []);
        return Array.isArray(m) ? m : [];
      }
      function loadStats() {
        var s = loadJSON(KEY_STATS, null);
        if (!s || typeof s !== "object") s = {};
        ["represent", "compare", "add", "sub", "mixed"].forEach(function (t) {
          if (!s[t] || typeof s[t].total !== "number") s[t] = { total: 0, correct: 0 };
          if (typeof s[t].correct !== "number") s[t].correct = 0;
        });
        return s;
      }
      function signature(p) {
        return p.type + "|" + p.op + "|" + p.terms.map(function (t) { return t.w + "," + t.n + "," + t.d; }).join("|");
      }
      function recordMistake(p) {
        var list = loadMistakes();
        var sig = signature(p);
        for (var i = 0; i < list.length; i++) { if (signature(list[i]) === sig) return; }
        list.push(p);
        saveJSON(KEY_MISTAKES, list);
      }
      function removeMistake(p) {
        var sig = signature(p);
        var list = loadMistakes().filter(function (m) { return signature(m) !== sig; });
        saveJSON(KEY_MISTAKES, list);
      }
      function addStat(type, correct) {
        var s = loadStats();
        s[type].total += 1;
        if (correct) s[type].correct += 1;
        saveJSON(KEY_STATS, s);
      }

      /* ---------- 問題の生成 ---------- */
      function makeAdd() {
        var d = pick(DENS);
        var n1 = randInt(1, d - 1), n2 = randInt(1, d - 1);
        return { type: "add", op: "+",
          terms: [{ w: 0, n: n1, d: d }, { w: 0, n: n2, d: d }], ansN: n1 + n2, ansD: d };
      }
      function makeSub() {
        var d = pick(DENS.filter(function (x) { return x >= 3; }));
        var n1 = randInt(2, d - 1), n2 = randInt(1, n1 - 1);
        return { type: "sub", op: "-",
          terms: [{ w: 0, n: n1, d: d }, { w: 0, n: n2, d: d }], ansN: n1 - n2, ansD: d };
      }
      /* 帯分数は「整数の部分と分数の部分を分けて計算する」ステップで
         組み立てられる形にする：たし算では分数の部分が くり上がらない、
         ひき算では くり下がり（1をくずす）が あっても 整数の部分が
         マイナスに ならない 問題だけを 出す。答えは 約分不要を 保証する。 */
      function makeMixed() {
        for (var i = 0; i < 600; i++) {
          var d = pick(DENS);
          var op = Math.random() < 0.5 ? "+" : "-";
          var w1 = randInt(1, 3), n1 = randInt(1, d - 1);
          var n2 = randInt(1, d - 1);
          var w2;
          if (op === "+") {
            w2 = Math.random() < 0.4 ? 0 : randInt(1, 3);
            if (n1 + n2 >= d) continue;              // 分数の部分で くり上がらない
            if (gcd(n1 + n2, d) !== 1) continue;     // 答えが 約分不要に なる
            return { type: "mixed", op: op,
              terms: [{ w: w1, n: n1, d: d }, { w: w2, n: n2, d: d }],
              ansN: (w1 + w2) * d + (n1 + n2), ansD: d };
          } else {
            w2 = Math.random() < 0.4 ? 0 : randInt(1, w1);
            if (n1 === n2) continue;
            var borrow = n1 < n2;
            if (borrow && w1 - 1 < w2) continue;     // 1を くずしても 整数の部分が 足りる
            var rem = borrow ? n1 + d - n2 : n1 - n2;
            if (gcd(rem, d) !== 1) continue;
            var whole = (borrow ? w1 - 1 : w1) - w2;
            var ans = whole * d + rem;
            if (ans <= 0) continue;
            return { type: "mixed", op: op,
              terms: [{ w: w1, n: n1, d: d }, { w: w2, n: n2, d: d }], ansN: ans, ansD: d };
          }
        }
        return { type: "mixed", op: "+", terms: [{ w: 1, n: 1, d: 5 }, { w: 0, n: 2, d: 5 }], ansN: 8, ansD: 5 };
      }
      function makeRepresent() {
        var d = pick([2, 3, 4, 5, 6, 8, 10]);
        if (Math.random() < 0.5) {
          var n = randInt(d + 1, d * 3 - 1);
          while (n % d === 0) n = randInt(d + 1, d * 3 - 1);
          return { type: "represent", op: "to-mixed",
            terms: [{ w: 0, n: n, d: d }], ansN: n, ansD: d,
            ansWhole: Math.floor(n / d), ansRem: n % d };
        }
        var w = randInt(1, 2), rem = randInt(1, d - 1);
        return { type: "represent", op: "to-improper",
          terms: [{ w: w, n: rem, d: d }], ansN: w * d + rem, ansD: d };
      }
      function makeCompare() {
        var left, right;
        if (Math.random() < 0.4) {
          var d = pick([2, 3, 4, 5]), n = randInt(1, d - 1);
          left = { w: 0, n: n, d: d };
          right = { w: 0, n: n * 2, d: d * 2 };
        } else {
          var sameD = pick(DENS);
          var n1 = randInt(1, sameD - 1), n2 = randInt(1, sameD - 1);
          while (n1 === n2) n2 = randInt(1, sameD - 1);
          left = { w: 0, n: n1, d: sameD };
          right = { w: 0, n: n2, d: sameD };
        }
        if (Math.random() < 0.5) { var swap = left; left = right; right = swap; }
        var delta = left.n * right.d - right.n * left.d;
        return { type: "compare", op: "compare", terms: [left, right],
          answerSymbol: delta > 0 ? "＞" : delta < 0 ? "＜" : "＝" };
      }
      function makeProblem(type) {
        if (type === "represent") return makeRepresent();
        if (type === "compare") return makeCompare();
        if (type === "add") return makeAdd();
        if (type === "sub") return makeSub();
        return makeMixed();
      }

      /* ---------- 分数の表示 ---------- */
      function fracHTML(n, d, mini, focusDen) {
        return '<span class="frac' + (mini ? " mini" : "") + '"><span class="f-num">' + n +
          '</span><span class="f-den' + (focusDen ? " focus-den" : "") + '">' + d + "</span></span>";
      }
      function termHTML(t, mini, focusDen) {
        var f = fracHTML(t.n, t.d, mini, focusDen);
        if (t.w > 0) return '<span><span class="whole">' + t.w + "</span>" + f + "</span>";
        return f;
      }
      function problemHTML(p, focusDen) {
        if (p.type === "compare") {
          return termHTML(p.terms[0], false, false) +
            ' <span class="op-sign">？</span> ' + termHTML(p.terms[1], false, false);
        }
        if (p.type === "represent") {
          var term = p.terms[0];
          if (p.op === "to-mixed") {
            return '<span class="problem-caption">仮分数を 帯分数に 直そう</span>' + fracHTML(term.n, term.d, false, false);
          }
          return '<span class="problem-caption">帯分数を 仮分数に 直そう</span>' + termHTML(term, false, false);
        }
        return termHTML(p.terms[0], false, focusDen) +
          ' <span class="op-sign">' + (p.op === "+" ? "＋" : "－") + "</span> " +
          termHTML(p.terms[1], false, focusDen) +
          ' <span class="op-sign">＝</span>';
      }
      function renderCompareModel(p) {
        var model = document.getElementById("comparison-model");
        if (!model) return;
        if (p.type !== "compare") {
          model.classList.add("hidden");
          model.innerHTML = "";
          return;
        }
        model.classList.remove("hidden");
        model.innerHTML = p.terms.map(function (t, i) {
          var percent = (t.n / t.d * 100).toFixed(2);
          return '<div class="fraction-bar-row"><span class="fraction-bar-label">' + (i === 0 ? "A" : "B") +
            '</span><div class="fraction-track" style="--parts:' + t.d + '"><div class="fraction-fill" style="width:' +
            percent + '%"></div></div><span>' + t.n + '/' + t.d + '</span></div>';
        }).join("");
      }
      /* ---------- ステップ列の生成 ----------
         問題データ（terms / op / ansN / ansD）から、ステップ列と
         各ステップの 正解値を 決定的に 作る。保存済みの まちがい記録
         （旧形式の 問題オブジェクト）からも 同じ列が 再現できる。 */
      function buildSteps(p) {
        var d = p.ansD, a = p.terms[0], b = p.terms[1];
        var sign = p.op === "+" ? "＋" : "－";
        var steps = [];
        if (p.type === "compare") {
          steps.push({
            id: "compare", slots: ["compare"],
            title: "大きさをくらべよう",
            reason: "図の長さや分数の1こ分に注目して、どちらが大きいか考えよう。同じ大きさなら「＝」を選ぶよ。",
            fields: [{ key: "symbol", caption: "大きさの関係", expect: p.answerSymbol, kind: "symbol" }],
            wrong: "AとBの図をもう一度見比べよう。長さが同じなら「＝」だよ。",
            okText: "図と分数の大きさを比べられたね。"
          });
          steps.push({ id: "done", final: true, title: "答えの 完成" });
          return steps;
        }
        if (p.type === "represent") {
          var term = p.terms[0];
          if (p.op === "to-mixed") {
            steps.push({
              id: "whole", slots: ["whole"],
              title: "整数はいくつできるかな？",
              reason: "分子の中に、分母が何回入るかを考えよう。その回数が整数の部分になるよ。",
              expr: term.n + " ÷ " + term.d + " ＝ ？",
              fields: [{ key: "main", caption: "整数の部分", expect: p.ansWhole }],
              wrong: "分子を分母でわって、商がいくつになるか考えよう。",
              okText: "整数の部分は " + p.ansWhole + " だね。"
            });
            steps.push({
              id: "num", slots: ["num"],
              title: "残りの分子を見つけよう",
              reason: "分母が入った分を取りのぞくと、残りが分数の部分の分子になるよ。",
              expr: term.n + " − " + p.ansWhole + " × " + term.d + " ＝ ？",
              fields: [{ key: "main", caption: "残りの分子", expect: p.ansRem }],
              wrong: "整数になった分を引いて、残りがいくつか確かめよう。",
              okText: "残りの分子は " + p.ansRem + " だね。"
            });
          } else {
            steps.push({
              id: "convert", slots: ["num"],
              title: "仮分数の分子をつくろう",
              reason: "整数1こ分は、分母と同じ数の単位分数が集まった大きさ。整数の分だけ分母をかけ、分数の分をたそう。",
              expr: term.w + " × " + term.d + " ＋ " + term.n + " ＝ ？",
              fields: [{ key: "main", caption: "仮分数の分子", expect: p.ansN }],
              wrong: "整数の部分を分母の数だけの分子に直してから、もとの分子をたそう。",
              okText: "仮分数の分子は " + p.ansN + " だね。"
            });
          }
          steps.push({ id: "done", final: true, title: "答えの 完成" });
          return steps;
        }
        steps.push({
          id: "den", slots: ["den"],
          title: "分母は そのまま",
          reason: "分母は、大きさの もとに なる 数です。分母が 同じ 問題では、分母は そのままに します。",
          fields: [{ key: "main", caption: "ぶんぼ", expect: d, noZero: true }],
          wrong: "分母は 変わらないよ。問題の 分母を よく 見て、もう一度 入れてみよう。",
          okText: "分母は " + d + " のまま だね。"
        });
        if (p.type === "mixed") {
          var borrow = p.op === "-" && a.n < b.n;
          if (borrow) {
            steps.push({
              id: "borrow", slots: ["num"],
              title: "1を くずそう",
              reason: "分数の 部分が ひけない ときは、整数の 部分から 1を くずして、分子に たします。",
              noteHTML: termHTML(a, true) + " → " +
                '<span><span class="whole">' + (a.w - 1) + "</span>" + fracHTML("？", d, true) + "</span>" +
                " に なおすよ。？に 入る 分子を 考えよう。",
              fields: [{ key: "main", caption: "くずした後の ぶんし", expect: a.n + d }],
              wrong: "1を くずすと、分子には 分母と 同じ 数が たされるよ。分母は " + d + " だね。",
              okText: "1を くずして、分子は " + (a.n + d) + " に なったね。"
            });
          }
          var numExpect = p.op === "+" ? a.n + b.n : (borrow ? a.n + d - b.n : a.n - b.n);
          var numExpr = (borrow ? (a.n + d) : a.n) + " " + sign + " " + b.n + " ＝ ？";
          steps.push({
            id: "num", slots: ["num"],
            title: "分数の 部分を 計算しよう",
            reason: p.op === "+" ?
              "分子は、かけらが いくつ あるかという 数です。分子どうしを たします。" :
              "分子は、かけらが いくつ あるかという 数です。分子どうしを ひきます。",
            expr: numExpr,
            fields: [{ key: "main", caption: "ぶんし", expect: numExpect }],
            wrong: "計算は「" + numExpr.replace("？", "□") + "」だよ。ゆっくり もう一度 計算してみよう。",
            okText: "分数の 部分の 分子は " + numExpect + " だね。"
          });
          var wholeBase = borrow ? a.w - 1 : a.w;
          var wholeExpect = p.op === "+" ? a.w + b.w : wholeBase - b.w;
          var wholeExpr = wholeBase + " " + sign + " " + b.w + " ＝ ？";
          steps.push({
            id: "whole", slots: ["whole"],
            title: "整数の 部分を 計算しよう",
            reason: borrow ?
              "1を くずしたので、整数の 部分は " + wholeBase + " に なっています。整数の 部分どうしを 計算します。" :
              (p.op === "+" ? "整数の 部分どうしを たします。" : "整数の 部分どうしを ひきます。"),
            expr: wholeExpr,
            fields: [{ key: "main", caption: "整数の 部分", expect: wholeExpect }],
            wrong: "計算は「" + wholeExpr.replace("？", "□") + "」だよ。ゆっくり もう一度 計算してみよう。",
            okText: "整数の 部分は " + wholeExpect + " だね。"
          });
        } else {
          var nExpect = p.op === "+" ? a.n + b.n : a.n - b.n;
          var nExpr = a.n + " " + sign + " " + b.n + " ＝ ？";
          steps.push({
            id: "num", slots: ["num"],
            title: "分子どうしを 計算しよう",
            reason: p.op === "+" ?
              "分子は、かけらが いくつ あるかという 数です。分子どうしを たします。" :
              "分子は、かけらが いくつ あるかという 数です。分子どうしを ひきます。",
            expr: nExpr,
            fields: [{ key: "main", caption: "ぶんし", expect: nExpect }],
            wrong: "計算は「" + nExpr.replace("？", "□") + "」だよ。ゆっくり もう一度 計算してみよう。",
            okText: "分子は " + nExpect + " だね。"
          });
          if (p.ansN > d) {
            steps.push({
              id: "convert", slots: ["whole", "num"],
              title: "帯分数に 直そう",
              reason: "答えが 1より 大きく なりました。分子が 分母と 同じ 大きさに なるたび、整数の 1に なります。",
              expr: "分子 " + p.ansN + " の 中に、分母 " + d + " は いくつ 入るかな？",
              fields: [
                { key: "whole", caption: "整数の 部分", expect: Math.floor(p.ansN / d) },
                { key: "num", caption: "残りの ぶんし", expect: p.ansN % d }
              ],
              wrong: "分子 " + p.ansN + " の 中に、分母 " + d + " が いくつ 入るか 数えてみよう。残りの 分子も 忘れずに。",
              okText: "帯分数に 直せたね。"
            });
          }
        }
        steps.push({ id: "done", final: true, title: "答えの 完成" });
        return steps;
      }

      /* 完成表示：組み上がった答えと、式全体 */
      function completionHTML(p) {
        var d = p.ansD, a = p.terms[0], b = p.terms[1];
        if (p.type === "compare") {
          return '<div class="final-answer">' + termHTML(a, false, false) + ' ' +
            p.answerSymbol + ' ' + termHTML(b, false, false) + '</div>' +
            '<p>図の長さを比べて、分数の大きさを確かめられたね。</p>';
        }
        if (p.type === "represent") {
          if (p.op === "to-mixed") {
            return '<div class="final-answer">' + fracHTML(a.n, d, false, false) + ' ＝ ' +
              '<span><span class="whole">' + p.ansWhole + '</span>' + fracHTML(p.ansRem, d, false, false) + '</span></div>' +
              '<p>分子の中に分母が ' + p.ansWhole + ' 回入り、残りは ' + p.ansRem + ' だね。</p>';
          }
          return '<div class="final-answer">' + termHTML(a, false, false) + ' ＝ ' +
            fracHTML(p.ansN, d, false, false) + '</div>' +
            '<p>整数 ' + a.w + ' こ分は ' + a.w + ' × ' + d + ' こ分。もとの分子 ' + a.n + ' をたすよ。</p>';
        }
        var sign = p.op === "+" ? "＋" : "－";
        var whole = Math.floor(p.ansN / d), rem = p.ansN % d;
        var ansHTML = whole > 0 && rem === 0 ? '<span class="whole">' + whole + '</span>' :
          whole > 0 ? '<span><span class="whole">' + whole + "</span>" + fracHTML(rem, d, false) + "</span>" :
          fracHTML(p.ansN, d, false);
        var lines = ['<div class="final-answer">' + problemHTML(p, false) + " " + ansHTML + "</div>"];
        if (p.type === "mixed") {
          lines.push("<p>分母は " + d + " のまま。整数の 部分と 分数の 部分を 分けて 計算しました。</p>");
        } else if (whole > 0 && rem === 0) {
          lines.push("<p>" + fracHTML(p.ansN, d, true) + " は、整数の " + whole + " と 同じ 大きさです。</p>");
        } else if (whole > 0) {
          lines.push("<p>" + fracHTML(p.ansN, d, true) + " は、帯分数では " +
            '<span><span class="whole">' + whole + "</span>" + fracHTML(rem, d, true) + "</span> と 同じ 大きさです。</p>");
        } else {
          lines.push("<p>分母は " + d + " のまま、分子は " + a.n + " " + sign + " " + b.n + " ＝ " + p.ansN + " です。</p>");
        }
        return lines.join("");
      }

      /* ---------- 画面の切り替え ---------- */
      var views = ["home", "practice", "result", "records"];
      function show(view) {
        views.forEach(function (v) {
          document.getElementById("view-" + v).classList.toggle("hidden", v !== view);
        });
        window.scrollTo(0, 0);
      }

      /* ---------- 練習セッション（スモールステップ方式） ---------- */
      var session = null; // { mode, type, queue, idx, results:[bool], steps, stepIdx, built, currentWrong, countedMistake, addedMistakes, startMistakes, cleared }
      var uiPhase = "input"; // 'input' | 'stepOk' | 'done'
      var stepInput = {};
      var activeFieldKey = null;

      function startNormal(type) {
        var queue = [];
        for (var i = 0; i < SESSION_LEN; i++) queue.push(makeProblem(type));
        session = { mode: "normal", type: type, queue: queue, idx: 0, results: [], addedMistakes: 0 };
        show("practice");
        renderProblem();
      }
      function startTokkun() {
        var list = loadMistakes();
        if (list.length === 0) return;
        session = { mode: "tokkun", type: null, queue: list.slice(), idx: 0, results: [], startMistakes: list.length, cleared: 0 };
        show("practice");
        renderProblem();
      }

      function currentProblem() { return session.queue[session.idx]; }
      function currentStep() { return session.steps[session.stepIdx]; }

      function renderProblem() {
        var p = currentProblem();
        var meta = TYPES[p.type] || TYPES.mixed;
        session.steps = buildSteps(p);
        session.stepIdx = 0;
        session.currentWrong = false;
        session.countedMistake = false;
        session.built = { den: p.type === "represent" ? p.terms[0].d : null, num: null, whole: null, converted: false };
        
        document.getElementById("practice-type-name").textContent =
          session.mode === "tokkun" ? "とっくん（まちがい直し）" : meta.name;
        var chip = document.getElementById("practice-chip");
        chip.className = "navi-chip " + p.type;
        document.getElementById("practice-navi-hint").textContent = meta.hint;
        setRandomNavi(document.getElementById("practice-navi-image"), "hint");
        renderCompareModel(p);

        document.getElementById("progress-label").textContent =
          (session.idx + 1) + " / " + session.queue.length + " もん";

        renderDotsOnly();
        renderStep();
      }

      function renderStep() {
        var p = currentProblem();
        var step = currentStep();
        uiPhase = "input";
        var isSymbolStep = step.fields.some(function (f) { return f.kind === "symbol"; });
        document.getElementById("keypad").classList.toggle("hidden", isSymbolStep);
        document.getElementById("symbol-keys").classList.toggle("hidden", !isSymbolStep);
        document.getElementById("builder-wrap").classList.toggle("hidden", currentProblem().type === "compare");
        stepInput = {};
        step.fields.forEach(function (f) { stepInput[f.key] = ""; });
        activeFieldKey = step.fields[0].key;

        document.getElementById("problem").innerHTML = problemHTML(p, step.id === "den");
        renderBuilder();

        var inputSteps = session.steps.length - 1; // 最後の 'done' を除いた数
        document.getElementById("step-badge").textContent =
          "ステップ " + (session.stepIdx + 1) + " / " + inputSteps;
        document.getElementById("step-title").textContent = step.title;
        document.getElementById("step-reason").textContent = step.reason || "";
        var note = document.getElementById("step-note");
        note.innerHTML = step.noteHTML || "";
        note.classList.toggle("hidden", !step.noteHTML);
        var expr = document.getElementById("step-expr");
        expr.textContent = step.expr || "";
        expr.classList.toggle("hidden", !step.expr);
        renderStepFields();

        document.getElementById("feedback").classList.add("hidden");
        document.getElementById("keypad").classList.remove("disabled");
        var check = document.getElementById("btn-check");
        check.disabled = false;
        check.classList.remove("hidden");
      }

      /* 答えの組み立て表示：済んだステップの値が スロットに 入っていく */
      function renderBuilder() {
        var p = currentProblem();
        var built = session.built;
        var step = currentStep();
        if (p.type === "compare") {
          document.getElementById("builder-wrap").classList.add("hidden");
          return;
        }
        document.getElementById("builder-wrap").classList.remove("hidden");
        if (p.type === "represent") {
          var d = p.terms[0].d;
          var repSlot = function (val, key) {
            var isActive = (step.slots || []).indexOf(key) >= 0;
            return '<span class="slot' + (val == null ? " empty" : "") +
              (isActive ? " active" : "") + '">' + (val == null ? "？" : val) + "</span>";
          };
          var repHTML = p.op === "to-mixed" ? repSlot(built.whole, "whole") : "";
          repHTML += '<span class="frac"><span class="f-num">' + repSlot(built.num, "num") +
            '</span><span class="f-den">' + d + '</span></span>';
          document.getElementById("builder").innerHTML = repHTML;
          return;
        }
        var active = {};
        (step.slots || []).forEach(function (s) { active[s] = true; });
        function slot(val, key) {
          return '<span class="slot' + (val == null ? " empty" : "") +
            (active[key] ? " active" : "") + '">' + (val == null ? "？" : val) + "</span>";
        }
        var fracPart = '<span class="frac"><span class="f-num">' + slot(built.num, "num") +
          '</span><span class="f-den">' + slot(built.den, "den") + "</span></span>";
        var showWhole = p.type === "mixed" || built.converted || step.id === "convert";
        document.getElementById("builder").innerHTML = (showWhole ? slot(built.whole, "whole") : "") + fracPart;
      }

      function renderStepFields() {
        var step = currentStep();
        var wrap = document.getElementById("step-fields");
        wrap.innerHTML = "";
        step.fields.forEach(function (f) {
          var box = document.createElement("div");
          box.className = "step-field";
          var cap = document.createElement("span");
          cap.className = "field-caption";
          cap.textContent = f.caption;
          var fld = document.createElement("div");
          fld.className = "field" + (activeFieldKey === f.key && uiPhase === "input" ? " active" : "");
          fld.setAttribute("role", "button");
          fld.setAttribute("tabindex", "0");
          fld.dataset.fkey = f.key;
          fld.innerHTML = stepInput[f.key] === "" ? '<span class="placeholder">？</span>' : stepInput[f.key];
          box.appendChild(cap);
          box.appendChild(fld);
          wrap.appendChild(box);
        });
      }

      function pressKey(k) {
        if (uiPhase !== "input") return;
        var step = currentStep();
        var field = null;
        step.fields.forEach(function (f) { if (f.key === activeFieldKey) field = f; });
        var cur = stepInput[activeFieldKey];
        var symbols = { lt: "＜", eq: "＝", gt: "＞" };
        if (symbols[k]) { cur = symbols[k]; }
        else if (k === "clear") { cur = ""; }
        else if (k === "bs") { cur = cur.slice(0, -1); }
        else {
          if (cur.length >= 3) return;
          if (cur === "" && k === "0" && field && field.noZero) return;
          cur = (cur + k).replace(/^0+(?=\d)/, "");
        }
        stepInput[activeFieldKey] = cur;
        renderStepFields();
      }

      function showFeedback(kind, title, bodyHTML, nextLabel) {
        var fb = document.getElementById("feedback");
        fb.classList.remove("hidden", "ok", "ng");
        fb.classList.add(kind);
        document.getElementById("feedback-title").textContent = title;
        document.getElementById("feedback-body").innerHTML = bodyHTML;
        var nb = document.getElementById("btn-next");
        if (nextLabel) { nb.classList.remove("hidden"); nb.textContent = nextLabel; }
        else nb.classList.add("hidden");
        fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      function checkStep() {
        if (uiPhase !== "input") return;
        var step = currentStep();
        var filled = true, ok = true;
        step.fields.forEach(function (f) {
          if (stepInput[f.key] === "") filled = false;
          else if (f.kind === "symbol" ? stepInput[f.key] !== f.expect : parseInt(stepInput[f.key], 10) !== f.expect) ok = false;
        });
        if (!filled) return;
        if (!ok) { onStepWrong(step); return; }
        onStepCorrect(step);
      }

      function onStepWrong(step) {
        var p = currentProblem();
        if (!session.currentWrong) {
          session.currentWrong = true;
          // 途中で 1回でも 間違えたら、その問題は「まちがえた問題」として記録する
          if (session.mode === "normal" && !session.countedMistake) {
            recordMistake(p);
            session.countedMistake = true;
            session.addedMistakes += 1;
          }
        }
        step.fields.forEach(function (f) { stepInput[f.key] = ""; });
        renderStepFields();
        showFeedback("ng", "× もう一度 考えよう", "<p>" + step.wrong + "</p>", null);
      }

      function onStepCorrect(step) {
        if (step.id === "den") session.built.den = step.fields[0].expect;
        else if (step.id === "num") session.built.num = step.fields[0].expect;
        else if (step.id === "whole") session.built.whole = step.fields[0].expect;
        else if (step.id === "convert") {
          if (step.fields.length === 1) {
            session.built.num = step.fields[0].expect;
          } else {
            session.built.whole = step.fields[0].expect;
            session.built.num = step.fields[1].expect;
            session.built.converted = true;
          }
        } else if (step.id === "compare") {
          session.built.compare = step.fields[0].expect;
        }
        uiPhase = "stepOk";
        document.getElementById("keypad").classList.add("disabled");
        document.getElementById("btn-check").disabled = true;
        renderBuilder();
        renderStepFields();
        var isLast = session.steps[session.stepIdx + 1].final === true;
        showFeedback("ok", "○ そのとおり！", "<p>" + step.okText + "</p>",
          isLast ? "答えを 見る" : "つぎの ステップへ");
      }

      function onNext() {
        if (uiPhase === "stepOk") {
          session.stepIdx += 1;
          if (currentStep().final) finishProblem();
          else renderStep();
        } else if (uiPhase === "done") {
          session.idx += 1;
          if (session.idx >= session.queue.length) { showResult(); return; }
          renderProblem();
        }
      }

      /* 最後まで 解き切ったとき：記録・集計は ここで 1回だけ 行う */
      function finishProblem() {
        var p = currentProblem();
        var correct = !session.currentWrong;
        uiPhase = "done";
        session.results.push(correct);
        addStat(p.type, correct);
        if (correct) {
          removeMistake(p); // ステップを 間違えずに 解けたら 克服
          if (session.mode === "tokkun") session.cleared += 1;
        }
        renderDotsOnly();

        document.getElementById("step-badge").textContent = "答えの 完成";
        document.getElementById("step-title").textContent = "できあがり！";
        document.getElementById("step-reason").textContent = "";
        var note = document.getElementById("step-note");
        note.innerHTML = completionHTML(p);
        note.classList.remove("hidden");
        document.getElementById("step-expr").classList.add("hidden");
        document.getElementById("step-fields").innerHTML = "";
        document.getElementById("problem").innerHTML = problemHTML(p, false);
        renderBuilder();
        document.getElementById("keypad").classList.add("disabled");
        var check = document.getElementById("btn-check");
        check.disabled = true;
        check.classList.add("hidden");

        var noteText;
        if (correct && session.mode === "tokkun") noteText = "この 問題は 克服！ 記録から 消えたよ。";
        else if (!correct && session.mode === "tokkun") noteText = "まちがえたので、記録は 残っているよ。また ちょうせんしよう。";
        else if (!correct) noteText = "まちがえたので、この 問題を とっくんに 記録したよ。";
        else noteText = "ステップを 全部 正しく 進められたね。";
        var lastQ = session.idx + 1 >= session.queue.length;
        showFeedback(correct ? "ok" : "ng", correct ? "○ せいかい！" : "さいごまで 解けた！",
          "<p>" + noteText + "</p>", lastQ ? "けっかを 見る" : "つぎの もんだいへ");
      }

      function renderDotsOnly() {
        var dots = document.getElementById("dots");
        dots.innerHTML = "";
        session.queue.forEach(function (_, i) {
          var s = document.createElement("span");
          if (i < session.results.length) s.className = session.results[i] ? "done-ok" : "done-ng";
          else if (i === session.idx) s.className = "now";
          dots.appendChild(s);
        });
      }

      function showResult() {
        var total = session.results.length;
        var ok = session.results.filter(Boolean).length;
        var title = document.getElementById("result-title");
        var score = document.getElementById("result-score");
        var msg = document.getElementById("result-msg");
        var note = document.getElementById("result-note");
        var again = document.getElementById("btn-again");
        document.getElementById("btn-result-home").classList.toggle("hidden", session.mode === "tokkun");
        if (session.mode === "tokkun") {
          title.textContent = "とっくんの けっか";
          score.textContent = session.cleared + " もん 克服！";
          msg.textContent = "さいしょ " + session.startMistakes + " もん あった まちがいが、" +
            loadMistakes().length + " もんに なったよ。";
          note.textContent = loadMistakes().length > 0 ? "残りは また とっくんで ちょうせんしよう。" : "まちがえた 問題は 全部 克服できたね！";
          again.textContent = "トップへ もどる";
          again.dataset.action = "home";
        } else {
          title.textContent = TYPES[session.type].name + " の けっか";
          score.textContent = ok + " / " + total + " もん せいかい";
          msg.textContent = ok === total ? "全問 せいかい！ すごいね。" :
            ok >= total * 0.7 ? "よく がんばったね。" : "まちがえた 問題は 「とっくん」で 直せるよ。";
          note.textContent = session.addedMistakes > 0 ?
            "新しく まちがえた 問題が " + session.addedMistakes + " もん、とっくんに 記録されたよ。" :
            "新しく まちがえた 問題は なかったよ。";
          again.textContent = "もう一度 れんしゅうする";
          again.dataset.action = "again";
        }
        show("result");
      }

      /* ---------- 記録画面 ---------- */
      function renderRecords() {
        var s = loadStats();
        var list = document.getElementById("record-list");
        list.innerHTML = "";
        ["represent", "compare", "add", "sub", "mixed"].forEach(function (t) {
          var st = s[t];
          var pct = st.total > 0 ? Math.round(st.correct / st.total * 100) : 0;
          var row = document.createElement("div");
          row.className = "record-row";
          var label = t === "mixed" ? "以前の記録：帯分数の計算" : TYPES[t].name;
          row.innerHTML =
            '<div class="r-head"><span class="r-name">' + label + '</span>' +
            '<span class="r-nums">' + st.total + ' もん中 ' + st.correct + ' もん せいかい（' + pct + '%）</span></div>' +
            '<div class="bar ' + t + '"><div style="width:' + pct + '%"></div></div>';
          list.appendChild(row);
        });
        document.getElementById("record-tokkun").textContent = loadMistakes().length + " もん";
        var rb = document.getElementById("btn-reset");
        rb.textContent = "記録を 全部 消す";
        rb.classList.remove("confirm");
        rb.dataset.armed = "";
      }

      function refreshHome() {
        var n = loadMistakes().length;
        document.querySelectorAll("[data-home-navi]").forEach(function (img) { setRandomNavi(img, "waving"); });
        document.getElementById("tokkun-count").textContent = n;
        document.getElementById("tokkun-desc").textContent = n > 0 ?
          "まちがえた 問題に もう一度 ちょうせん。正解すると 記録が 消えるよ。" :
          "まちがえた 問題は まだ ないよ。れんしゅうで まちがえると ここに たまるよ。";
      }

      /* ---------- イベント ---------- */
      document.querySelectorAll("[data-start]").forEach(function (el) {
        el.addEventListener("click", function () { startNormal(el.dataset.start); });
      });
      document.getElementById("btn-tokkun").addEventListener("click", function () {
        if (loadMistakes().length === 0) {
          document.getElementById("tokkun-desc").textContent = "まちがえた 問題は まだ ないよ。先に れんしゅうを してみよう。";
          return;
        }
        startTokkun();
      });
      document.getElementById("btn-records").addEventListener("click", function () {
        renderRecords();
        show("records");
      });
      document.getElementById("btn-records-back").addEventListener("click", function () { refreshHome(); show("home"); });
      document.getElementById("btn-quit").addEventListener("click", function () { refreshHome(); show("home"); });
      document.getElementById("btn-result-home").addEventListener("click", function () { refreshHome(); show("home"); });
      document.getElementById("btn-again").addEventListener("click", function () {
        if (this.dataset.action === "again" && session) startNormal(session.type);
        else { refreshHome(); show("home"); }
      });
      document.getElementById("btn-next").addEventListener("click", onNext);
      document.getElementById("btn-check").addEventListener("click", checkStep);

      document.getElementById("step-fields").addEventListener("click", function (e) {
        var fld = e.target.closest(".field");
        if (!fld || uiPhase !== "input") return;
        activeFieldKey = fld.dataset.fkey;
        renderStepFields();
      });

      document.getElementById("keypad").addEventListener("click", function (e) {
        var b = e.target.closest("button");
        if (!b) return;
        pressKey(b.dataset.key);
      });

      document.getElementById("symbol-keys").addEventListener("click", function (e) {
        var b = e.target.closest("button");
        if (!b) return;
        pressKey(b.dataset.key);
      });

      document.getElementById("btn-reset").addEventListener("click", function () {
        if (this.dataset.armed === "1") {
          saveJSON(KEY_MISTAKES, []);
          saveJSON(KEY_STATS, {
            represent: { total: 0, correct: 0 }, compare: { total: 0, correct: 0 },
            add: { total: 0, correct: 0 }, sub: { total: 0, correct: 0 }, mixed: { total: 0, correct: 0 }
          });
          renderRecords();
        } else {
          this.dataset.armed = "1";
          this.textContent = "ほんとうに 消す？ もう一度 おしてね";
          this.classList.add("confirm");
        }
      });

      refreshHome();
    </script>
  </body>
</html>
